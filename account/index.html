<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>My account | Rehohub</title>
    <meta name="description" content="My account" />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/account.css" />
  </head>
  <body data-page="account">
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="top__in">
        <a class="logo" href="../index.html" aria-label="Rehohub home"
          ><svg viewBox="0 0 80 80" aria-hidden="true">
            <rect width="80" height="80" rx="12" fill="#1760BA" />
            <g transform="translate(40 40) scale(0.95) translate(-126 -81)" fill="#fff">
              <path
                fill-rule="evenodd"
                d="M118.56 107.61c5.7-12.04 13.1-.34 18.93 0h13.29l-12.98-20.54c5.73-2.44 9.47-8.32 9.47-15.12 0-4.96-1.76-9.09-5.35-12.45-3.51-3.43-7.79-5.11-12.75-5.11h-22.3c24.96 12.14-.55 33.86 0 53.22z"
              />
              <circle cx="106.09" cy="69.29" r="4.87" />
            </g></svg
          ><span>Rehohub<span class="dot">.</span></span></a
        >
        <nav aria-label="Account">
          <a href="index.html" aria-current="page">My account</a
          ><a href="admin.html" data-admin-link hidden>Admin console</a
          ><button class="btn btn--ghost btn--sm" type="button" data-logout>Sign out</button>
        </nav>
      </div>
    </header>
    <main class="page" id="main">
      <div>
        <h1 data-hello>My account</h1>
        <p class="mute" data-email></p>
      </div>
      <div class="cols">
        <div style="display: grid; gap: 20px">
          <section class="card" aria-labelledby="h-roles">
            <h2 id="h-roles">Your products and roles</h2>
            <div id="roles"><p class="mute">Loading…</p></div>
          </section>
          <section class="card" aria-labelledby="h-apply">
            <h2 id="h-apply">Add a product or role</h2>
            <p class="mute" style="margin: 0; font-size: 14px">
              Customer access is added straight away; other roles are reviewed by our team.
              <a href="../assets/media/rehohub/rehohub-add-services-guide.mp4" download="Rehohub-add-services-guide.mp4"
                >Download the 1-minute how-to video</a
              >
            </p>
            <form id="apply" novalidate>
              <fieldset>
                <legend class="sr-only">Choose</legend>
                <div data-apply-roles></div>
              </fieldset>
              <div data-apply-details style="display: grid; gap: 14px"></div>
              <div data-msg hidden tabindex="-1"></div>
              <button class="btn" type="submit">Add to my account</button>
            </form>
          </section>
        </div>
        <div style="display: grid; gap: 20px">
          <section class="card" aria-labelledby="h-profile">
            <h2 id="h-profile">Profile</h2>
            <form id="profile" novalidate>
              <label class="field"
                ><span>Full name</span><input class="inp" name="full_name" autocomplete="name" required maxlength="120"
              /></label>
              <label class="field"
                ><span>Phone</span><input class="inp" name="phone" type="tel" autocomplete="tel" maxlength="30"
              /></label>
              <div data-msg hidden tabindex="-1"></div>
              <button class="btn btn--line" type="submit">Save</button>
            </form>
          </section>
          <section class="card" aria-labelledby="h-pw">
            <h2 id="h-pw">Change password</h2>
            <form id="password" novalidate>
              <label class="field"
                ><span>Current password</span
                ><span class="pw"
                  ><input
                    class="inp"
                    name="current_password"
                    type="password"
                    autocomplete="current-password"
                    required
                    maxlength="200"
                  /><button type="button" data-pw aria-pressed="false">Show</button></span
                ></label
              >
              <label class="field"
                ><span>New password</span
                ><span class="pw"
                  ><input
                    class="inp"
                    name="new_password"
                    type="password"
                    autocomplete="new-password"
                    required
                    maxlength="200"
                  /><button type="button" data-pw aria-pressed="false">Show</button></span
                ><small>At least 10 characters. Other devices will be signed out.</small></label
              >
              <div data-msg hidden tabindex="-1"></div>
              <button class="btn btn--line" type="submit">Change password</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script src="../assets/js/rh-auth.js"></script>
    <script src="../assets/js/account.js"></script>
  </body>
</html>
